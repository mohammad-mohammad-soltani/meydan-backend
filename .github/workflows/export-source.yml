name: Export backend source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-source.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
      - name: Pack source
        run: |
          tar --exclude=.git --exclude=.env -czf /tmp/meydan-backend-source.tar.gz .
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: meydan-backend-source
          path: /tmp/meydan-backend-source.tar.gz
          retention-days: 1
