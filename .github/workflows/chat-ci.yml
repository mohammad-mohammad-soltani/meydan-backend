name: Realtime chat CI

on:
  pull_request:
    paths:
      - "wp-content/plugins/meydan-core/**"
      - "docker-compose.yml"
      - ".github/workflows/chat-ci.yml"

permissions:
  contents: read

jobs:
  verify-chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Lint chat and Soketi PHP
        run: |
          php -l wp-content/plugins/meydan-core/src/Database/ChatMigrations.php
          php -l wp-content/plugins/meydan-core/src/Support/ChatRepository.php
          php -l wp-content/plugins/meydan-core/src/Support/SoketiRealtime.php
          php -l wp-content/plugins/meydan-core/src/Rest/ChatController.php
          php -l wp-content/plugins/meydan-core/src/Rest/ChatRoutes.php
          php -l wp-content/plugins/meydan-core/src/Notifications/NotificationService.php
          php -l wp-content/plugins/meydan-core/src/Plugin.php

      - name: Validate Docker Compose
        run: docker compose config >/dev/null
