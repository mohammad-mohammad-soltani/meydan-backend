name: Deploy backend to Freestyle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "wp-content/**"
      - "docker/**"
      - "realtime-chat/**"
      - "docker-compose.yml"
      - "tools/freestyle-create-vm.mjs"
      - ".github/workflows/deploy-freestyle.yml"

concurrency:
  group: meydan-backend-freestyle-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  FREESTYLE_VM_SLUG: meydan-backend-1362642112
  FREESTYLE_DOMAIN: meydan-backend-1362642112.style.dev
  CHAT_DOMAIN: meydan-chat-1362642112.style.dev
  WORDPRESS_PORT: "8082"
  CHAT_PORT: "3001"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Check Freestyle credentials
        id: auth
        env:
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
        run: |
          if [ -n "$FREESTYLE_API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::FREESTYLE_API_KEY is not configured. Add it as a repository Actions secret, then run this workflow again."
          fi

      - name: Set up Node.js
        if: steps.auth.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test realtime chat ticket verifier
        if: steps.auth.outputs.ready == 'true'
        working-directory: realtime-chat
        run: npm test

      - name: Install Freestyle SDK and CLI
        if: steps.auth.outputs.ready == 'true'
        run: npm install --no-save freestyle@latest

      - name: Create or reuse persistent Freestyle VM
        if: steps.auth.outputs.ready == 'true'
        env:
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
        run: node tools/freestyle-create-vm.mjs

      - name: Package backend source
        if: steps.auth.outputs.ready == 'true'
        run: |
          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=node_modules \
            --exclude=.env \
            -czf /tmp/meydan-backend.tar.gz .

          cat >/tmp/deploy-meydan-backend.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          DOMAIN="$1"
          PORT="$2"
          CHAT_DOMAIN="$3"
          CHAT_PORT="$4"
          APP_DIR=/srv/meydan-backend
          RELEASE_DIR=/tmp/meydan-backend-release

          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR" "$APP_DIR"
          tar -xzf /tmp/meydan-backend.tar.gz -C "$RELEASE_DIR"

          find "$APP_DIR" -mindepth 1 -maxdepth 1 ! -name .env -exec rm -rf {} +
          cp -a "$RELEASE_DIR"/. "$APP_DIR"/
          cd "$APP_DIR"

          set_env() {
            local key="$1"
            local value="$2"
            if grep -q "^${key}=" .env 2>/dev/null; then
              sed -i "s|^${key}=.*|${key}=${value}|" .env
            else
              printf '%s=%s\n' "$key" "$value" >>.env
            fi
          }

          if [ ! -f .env ]; then
            umask 077
            cat >.env <<EOF
          COMPOSE_PROJECT_NAME=meydan-backend
          WORDPRESS_PORT=${PORT}
          CHAT_PORT=${CHAT_PORT}
          DB_NAME=meydan
          DB_USER=meydan
          DB_PASSWORD=$(openssl rand -hex 24)
          DB_ROOT_PASSWORD=$(openssl rand -hex 32)
          WP_URL=https://${DOMAIN}
          CHAT_PUBLIC_URL=https://${CHAT_DOMAIN}
          MEYDAN_CHAT_SOCKET_SECRET=$(openssl rand -hex 32)
          MEYDAN_CHAT_CORS_ORIGIN=*
          WP_TITLE=Meydan Backend
          WP_ADMIN_USER=admin
          WP_ADMIN_PASSWORD=$(openssl rand -hex 24)
          WP_ADMIN_EMAIL=admin@example.com
          WP_DEBUG=0
          WP_ENVIRONMENT_TYPE=production
          MEYDAN_DEV_OTP_CODE=
          MEYDAN_SMS_ENDPOINT=
          MEYDAN_SMS_TOKEN=
          MEYDAN_SMS_FROM_NUMBER=
          MEYDAN_SMS_PATTERN_CODE=
          EOF
            chmod 600 .env
          else
            set_env COMPOSE_PROJECT_NAME meydan-backend
            set_env WORDPRESS_PORT "$PORT"
            set_env CHAT_PORT "$CHAT_PORT"
            set_env WP_URL "https://${DOMAIN}"
            set_env CHAT_PUBLIC_URL "https://${CHAT_DOMAIN}"
            set_env WP_DEBUG 0
            set_env WP_ENVIRONMENT_TYPE production
            set_env MEYDAN_DEV_OTP_CODE ""
            if ! grep -Eq '^MEYDAN_CHAT_SOCKET_SECRET=.+$' .env; then
              set_env MEYDAN_CHAT_SOCKET_SECRET "$(openssl rand -hex 32)"
            fi
            if ! grep -q '^MEYDAN_CHAT_CORS_ORIGIN=' .env; then
              set_env MEYDAN_CHAT_CORS_ORIGIN "*"
            fi
            chmod 600 .env
          fi

          systemctl enable --now docker >/dev/null
          docker compose pull
          docker compose build chat-realtime
          docker compose up -d db wordpress chat-realtime
          docker compose run --rm wpcli
          docker compose ps

          curl -fsSL \
            -H "Host: ${DOMAIN}" \
            -H "X-Forwarded-Proto: https" \
            "http://127.0.0.1:${PORT}/wp-json/meydan/v1/config" >/dev/null
          curl -fsSL "http://127.0.0.1:${CHAT_PORT}/health" >/dev/null
          SCRIPT
          chmod +x /tmp/deploy-meydan-backend.sh

      - name: Upload backend to Freestyle VM
        if: steps.auth.outputs.ready == 'true'
        env:
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
        run: |
          npx freestyle@latest vm fs write "$FREESTYLE_VM_SLUG" /tmp/meydan-backend.tar.gz /tmp/meydan-backend.tar.gz
          npx freestyle@latest vm fs write "$FREESTYLE_VM_SLUG" /tmp/deploy-meydan-backend.sh /tmp/deploy-meydan-backend.sh

      - name: Start backend services
        if: steps.auth.outputs.ready == 'true'
        env:
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
        run: |
          npx freestyle@latest vm exec "$FREESTYLE_VM_SLUG" \
            --linux-user root \
            --timeout-ms 300000 \
            -- bash /tmp/deploy-meydan-backend.sh "$FREESTYLE_DOMAIN" "$WORDPRESS_PORT" "$CHAT_DOMAIN" "$CHAT_PORT"

      - name: Route HTTPS domains
        if: steps.auth.outputs.ready == 'true'
        env:
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
        run: |
          if ! npx freestyle@latest tls list --vm "$FREESTYLE_VM_SLUG" | grep -Fq "$FREESTYLE_DOMAIN"; then
            npx freestyle@latest tls create \
              --domain "$FREESTYLE_DOMAIN" \
              --from public \
              --to "vm=$FREESTYLE_VM_SLUG,port=$WORDPRESS_PORT"
          fi
          if ! npx freestyle@latest tls list --vm "$FREESTYLE_VM_SLUG" | grep -Fq "$CHAT_DOMAIN"; then
            npx freestyle@latest tls create \
              --domain "$CHAT_DOMAIN" \
              --from public \
              --to "vm=$FREESTYLE_VM_SLUG,port=$CHAT_PORT"
          fi

      - name: Verify public services
        if: steps.auth.outputs.ready == 'true'
        run: |
          curl -fsSL --retry 18 --retry-delay 5 --retry-all-errors \
            "https://${FREESTYLE_DOMAIN}/wp-json/meydan/v1/config" >/dev/null
          curl -fsSL --retry 18 --retry-delay 5 --retry-all-errors \
            "https://${CHAT_DOMAIN}/health" >/dev/null
          echo "### Freestyle backend deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "API: https://${FREESTYLE_DOMAIN}/wp-json/meydan/v1" >> "$GITHUB_STEP_SUMMARY"
          echo "Realtime: https://${CHAT_DOMAIN}" >> "$GITHUB_STEP_SUMMARY"

      - name: Freestyle credential required
        if: steps.auth.outputs.ready != 'true'
        run: |
          echo "Deployment workflow is installed, but deployment was skipped because the repository secret FREESTYLE_API_KEY is not configured."
