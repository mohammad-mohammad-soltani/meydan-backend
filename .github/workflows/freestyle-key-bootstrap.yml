name: Freestyle one-time key bootstrap

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/freestyle-key-bootstrap.yml"

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Generate one-time encryption keypair
        run: |
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/freestyle-private.pem
          openssl pkey -in /tmp/freestyle-private.pem -pubout -out /tmp/freestyle-public.pem
          echo "FREESTYLE_PUBLIC_KEY_B64=$(base64 -w0 /tmp/freestyle-public.pem)"
      - name: Store one-time private key briefly
        uses: actions/upload-artifact@v4
        with:
          name: freestyle-one-time-private-key-${{ github.run_id }}
          path: /tmp/freestyle-private.pem
          retention-days: 1
          if-no-files-found: error
