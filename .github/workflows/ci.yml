name: Meydan Backend CI
on:
  push:
  pull_request:
jobs:
  lint-and-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: PHP syntax
        run: find wp-content/plugins/meydan-core -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Required REST inventory
        run: python3 tests/check-route-inventory.py
  docker-smoke:
    runs-on: ubuntu-latest
    needs: lint-and-inventory
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        run: cp .env.example .env
      - name: Start WordPress
        run: docker compose up -d db wordpress
      - name: Install WordPress and plugin
        run: docker compose run --rm wpcli
      - name: Smoke test API
        run: tests/smoke.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color db wordpress
