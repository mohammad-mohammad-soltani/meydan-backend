name: Meydan Backend CI
on:
  push:
  pull_request:
jobs:
  lint-and-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: PHP syntax
        run: find wp-content/plugins/meydan-core -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Required REST inventory
        run: python3 tests/check-route-inventory.py
      - name: Notification event coverage
        run: python3 tests/check-notification-events.py
      - name: Root response contract
        run: python3 tests/check-root-response.py
      - name: Speaker role model
        run: python3 tests/check-speaker-role.py
      - name: Eitaa integration contract
        run: python3 tests/check-eitaa-integration.py
      - name: Bale bot integration contract
        run: python3 tests/check-bale-integration.py
  docker-smoke:
    runs-on: ubuntu-latest
    needs: lint-and-inventory
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        run: cp .env.example .env
      - name: Create shared Eitaa network
        run: docker network inspect meydan_internal >/dev/null 2>&1 || docker network create meydan_internal
      - name: Validate Compose
        run: docker compose config
      - name: Start WordPress
        run: docker compose up -d db wordpress
      - name: Install WordPress and plugin
        run: docker compose run --rm wpcli
      - name: Smoke test API
        run: tests/smoke.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color db wordpress
