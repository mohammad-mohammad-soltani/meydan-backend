name: Cleanup Freestyle bootstrap artifact

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-freestyle-bootstrap.yml"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete one-time private-key artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/10121844399"
