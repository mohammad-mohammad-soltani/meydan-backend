# Raise MaxRequestWorkers as RAM allows: roughly (RAM for PHP) / 60 MB.
<IfModule mpm_prefork_module>
    StartServers             5
    MinSpareServers          5
    MaxSpareServers         15
    MaxRequestWorkers       30
    MaxConnectionsPerChild 2000
</IfModule>
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 2
