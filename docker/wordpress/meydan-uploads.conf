# Immutable caching for every uploaded file.
#
# Upload names are unique and their contents never change in place, so clients
# may keep them for a year. Range requests (`Accept-Ranges: bytes`) and the
# static-file handler are untouched; already-compressed media is never gzipped.
<Directory "/var/www/html/wp-content/uploads">
    AllowOverride All
    Options -Indexes

    <IfModule mod_headers.c>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </IfModule>

    <IfModule mod_deflate.c>
        SetEnvIfNoCase Request_URI \.(?:mp4|m4v|mov|webm|ogv|mp3|m4a|aac|ogg|oga|opus|flac|wav|jpg|jpeg|png|gif|webp|avif|zip|gz|pdf)$ no-gzip dont-vary
    </IfModule>
</Directory>
