# Pure cache: WordPress object cache + transients. Losing it is always safe.
# allkeys-lru (not volatile-lru) on purpose: WordPress writes many keys without a TTL,
# and volatile-lru would never evict them and would end in OOM errors.
maxmemory 1gb
maxmemory-policy allkeys-lru
maxmemory-samples 5
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
save ""
appendonly no
tcp-keepalive 60
timeout 300
