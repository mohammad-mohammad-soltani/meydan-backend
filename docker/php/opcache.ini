opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
; Code is baked/mounted per deploy and the container is restarted on deploy.
; Set OPCACHE_VALIDATE=1 in local dev if you edit PHP files live.
opcache.validate_timestamps = ${OPCACHE_VALIDATE:-0}
opcache.revalidate_freq = 0
realpath_cache_size = 4M
realpath_cache_ttl = 600
