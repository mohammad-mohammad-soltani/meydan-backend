opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
; Files are re-checked at most every 30 s (one stat per file). This keeps edits to wp-config.php and plugin files
; (written by wp-init.sh / deploys) from being ignored. Set OPCACHE_VALIDATE=0 only for fully immutable images.
opcache.validate_timestamps = ${OPCACHE_VALIDATE:-1}
opcache.revalidate_freq = 30
realpath_cache_size = 4M
realpath_cache_ttl = 600
