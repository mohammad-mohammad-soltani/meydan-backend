services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-meydan}
      MARIADB_USER: ${DB_USER:-meydan}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    # innodb_buffer_pool_size: keep it at 50-60% of the RAM the db may use (DB_BUFFER_POOL in .env).
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW --innodb-buffer-pool-size=${DB_BUFFER_POOL:-1G}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mariadb/tuning.cnf:/etc/mysql/conf.d/zz-meydan-tuning.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    # Hard container cap above maxmemory (1gb) so Redis can never starve MariaDB/PHP.
    mem_limit: 1280m
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}

  wordpress:
    build:
      context: ./docker/wordpress
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${WORDPRESS_PORT:-8082}:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-meydan}
      WORDPRESS_DB_USER: ${DB_USER:-meydan}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      REDIS_HOST: redis
      OPCACHE_VALIDATE: ${OPCACHE_VALIDATE:-1}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      WP_URL: ${WP_URL:-http://localhost:8082}
      WORDPRESS_DEBUG: ${WP_DEBUG:-1}
      WP_ENVIRONMENT_TYPE: ${WP_ENVIRONMENT_TYPE:-local}
      MEYDAN_DEV_OTP_CODE: ${MEYDAN_DEV_OTP_CODE:-}
      MEYDAN_DEV_OTP_TTL: ${MEYDAN_DEV_OTP_TTL:-}
      MEYDAN_SMS_ENDPOINT: ${MEYDAN_SMS_ENDPOINT:-}
      MEYDAN_SMS_TOKEN: ${MEYDAN_SMS_TOKEN:-}
      MEYDAN_SMS_FROM_NUMBER: ${MEYDAN_SMS_FROM_NUMBER:-}
      MEYDAN_SMS_PATTERN_CODE: ${MEYDAN_SMS_PATTERN_CODE:-}
      MEYDAN_EITAA_SYNC_SECRET: ${MEYDAN_EITAA_SYNC_SECRET:-}
      EITAA_SERVICE_URL: ${EITAA_SERVICE_URL:-http://eitaa-api:3000}
      MEYDAN_BALE_SYNC_SECRET: ${MEYDAN_BALE_SYNC_SECRET:-}
      BALE_SERVICE_URL: ${BALE_SERVICE_URL:-http://bale-api:8000}
      MEYDAN_PUSHE_APP_ID: ${MEYDAN_PUSHE_APP_ID:-}
      MEYDAN_PUSHE_TOKEN: ${MEYDAN_PUSHE_TOKEN:-}
      MEYDAN_FRONTEND_URL: ${MEYDAN_FRONTEND_URL:-}
      MEDIA_STORAGE: ${MEDIA_STORAGE:-local}
      MEDIA_STORAGE_PREFIX: ${MEDIA_STORAGE_PREFIX:-local}
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-}
      MEDIA_MAX_FILE_SIZE: ${MEDIA_MAX_FILE_SIZE:-104857600}
      MEDIA_ALLOWED_MIME_TYPES: ${MEDIA_ALLOWED_MIME_TYPES:-}
      MEDIA_STORAGE_SHA256_VERIFY: ${MEDIA_STORAGE_SHA256_VERIFY:-true}
      MEDIA_STORAGE_SHA256_MAX_BYTES: ${MEDIA_STORAGE_SHA256_MAX_BYTES:-268435456}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      WORDPRESS_CONFIG_EXTRA: |
        if (!empty($$_SERVER['HTTP_X_FORWARDED_PROTO']) && strpos($$_SERVER['HTTP_X_FORWARDED_PROTO'], 'https') !== false) {
            $$_SERVER['HTTPS'] = 'on';
        }
        if (!empty($$_SERVER['HTTP_X_FORWARDED_SSL']) && $$_SERVER['HTTP_X_FORWARDED_SSL'] === 'on') {
            $$_SERVER['HTTPS'] = 'on';
        }
        $$meydan_wp_url = getenv('WP_URL');
        if ($$meydan_wp_url) {
            define('WP_HOME', $$meydan_wp_url);
            define('WP_SITEURL', $$meydan_wp_url);
        }
        define('WP_ENVIRONMENT_TYPE', getenv('WP_ENVIRONMENT_TYPE') ?: 'production');
        define('MEYDAN_DEV_OTP_CODE', getenv('MEYDAN_DEV_OTP_CODE') ?: '');
        define('MEYDAN_DEV_OTP_TTL', getenv('MEYDAN_DEV_OTP_TTL') ?: '');
        define('MEYDAN_SMS_ENDPOINT', getenv('MEYDAN_SMS_ENDPOINT') ?: '');
        define('MEYDAN_SMS_TOKEN', getenv('MEYDAN_SMS_TOKEN') ?: '');
        define('MEYDAN_EITAA_SYNC_SECRET', getenv('MEYDAN_EITAA_SYNC_SECRET') ?: '');
        define('EITAA_SERVICE_URL', getenv('EITAA_SERVICE_URL') ?: '');
        define('MEYDAN_PUSHE_APP_ID', getenv('MEYDAN_PUSHE_APP_ID') ?: '');
        define('MEYDAN_PUSHE_TOKEN', getenv('MEYDAN_PUSHE_TOKEN') ?: '');
        define('MEYDAN_FRONTEND_URL', getenv('MEYDAN_FRONTEND_URL') ?: '');
        define('DISALLOW_FILE_EDIT', true);
        define('FORCE_SSL_ADMIN', (getenv('WP_ENVIRONMENT_TYPE') ?: 'local') === 'production');
        define('COOKIE_DOMAIN', '');
        define('COOKIEPATH', '/');
        define('SITECOOKIEPATH', '/');
        define('ADMIN_COOKIE_PATH', '/');
        define('PLUGINS_COOKIE_PATH', '/');
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/plugins/meydan-core:/var/www/html/wp-content/plugins/meydan-core
      - ./docker/uploads.ini:/usr/local/etc/php/conf.d/zz-meydan-uploads.ini:ro
      - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/zz-meydan-opcache.ini:ro
    networks:
      - default
      - meydan_internal

  wpcli:
    build:
      context: ./docker/wpcli
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
      redis:
        condition: service_started
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-meydan}
      WORDPRESS_DB_USER: ${DB_USER:-meydan}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      WP_URL: ${WP_URL:-http://localhost:8082}
      WP_TITLE: ${WP_TITLE:-Meydan Backend}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:?set WP_ADMIN_PASSWORD in .env}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@example.com}
      MEDIA_STORAGE: ${MEDIA_STORAGE:-local}
      MEDIA_STORAGE_PREFIX: ${MEDIA_STORAGE_PREFIX:-local}
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-}
      MEDIA_MAX_FILE_SIZE: ${MEDIA_MAX_FILE_SIZE:-104857600}
      MEDIA_ALLOWED_MIME_TYPES: ${MEDIA_ALLOWED_MIME_TYPES:-}
      MEDIA_STORAGE_SHA256_VERIFY: ${MEDIA_STORAGE_SHA256_VERIFY:-true}
      MEDIA_STORAGE_SHA256_MAX_BYTES: ${MEDIA_STORAGE_SHA256_MAX_BYTES:-268435456}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/plugins/meydan-core:/var/www/html/wp-content/plugins/meydan-core
      - ./docker/wp-init.sh:/usr/local/bin/wp-init.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/wp-init.sh"]
    restart: "no"

  # Replaces WP-Cron-on-request (DISABLE_WP_CRON): runs due events every minute.
  cron:
    build:
      context: ./docker/wpcli
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
      redis:
        condition: service_started
    user: "33:33"
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-meydan}
      WORDPRESS_DB_USER: ${DB_USER:-meydan}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      WP_URL: ${WP_URL:-http://localhost:8082}
      MEDIA_STORAGE: ${MEDIA_STORAGE:-local}
      MEDIA_STORAGE_PREFIX: ${MEDIA_STORAGE_PREFIX:-local}
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    volumes:
      - wp_data:/var/www/html
      - ./wp-content/plugins/meydan-core:/var/www/html/wp-content/plugins/meydan-core
    entrypoint: ["/bin/sh", "-c", "until [ -f /var/www/html/wp-load.php ]; do sleep 5; done; while true; do wp cron event run --due-now >/dev/null 2>&1 || true; sleep 60; done"]

volumes:
  db_data:
  wp_data:

networks:
  meydan_internal:
    external: true
    name: ${MEYDAN_DOCKER_NETWORK:-meydan_internal}
